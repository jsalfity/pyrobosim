# Suite100 battery world (R suite): the base world plus a robot that starts
# at 45% battery. Drain rates live in failure_profiles/nominal_battery.yaml
# (battery_usage is an ExecutionOptions field, and the profile replaces the
# robot's options after every reset). Driving to the charger refills to 100%
# (charger has is_charger: true). Numbers are uncalibrated estimates.
# Same map, locations and objects as
# roscon_2024_workshop_world.yaml; only built-in PyRoboSim options change:
#   - the robot starts in a random room (a location list is sampled at reset)
#   - the robot only knows objects it has detected (partial_obs_objects)
#   - the fridge and pantry start closed
#   - bread, butter, soda and snacks each start in the pantry, the fridge or
#     on the desk (uniform); waste0 starts on the desk or the table; waste1
#     stays in the bin, which is never a destination
# Objects are named explicitly so success blocks can score by name.
# Placement and start room are re-drawn by world.reset(deterministic=False,
# seed=k). Skill failures come from the sim_app failure profile (nominal for
# this world), not from this file: _apply_failures replaces each robot's
# action_execution_options after every load and reset.
# Based on the ROSCon 2024 deliberation workshop world.
# https://github.com/ros-wg-delib/roscon24-workshop

metadata:
  locations: $PWD/roscon_2024_location_data.yaml
  objects: $PWD/roscon_2024_object_data.yaml

params:
  name: roscon_2024_world
  inflation_radius: 0.01
  object_radius: 0.01

robots:
  - name: robot
    radius: 0.1
    location: [dining, kitchen, office, closet, trash]
    partial_obs_objects: true
    initial_battery_level: 45.0
    path_executor:
      type: constant_velocity
    path_planner:
      type: rrt
      bidirectional: true
      max_connection_dist: 1.0
      max_time: 5.0
    sensors:
      lidar:
        type: lidar
        update_rate_s: 0.1
        angle_units: degrees
        min_angle: -120.0
        max_angle: 120.0
        angular_resolution: 5.0
        max_range_m: 2.0
    start_sensor_threads: true

rooms:
  - name: dining
    footprint:
      type: polygon
      coords:
        - [-1.6, -1.0]
        - [1.6, -1.0]
        - [1.6, 1.0]
        - [-1.6, 1.0]
    # Add navigation poses since the centroid is blocked by the table.
    nav_poses:
      - position:  # left
          x: -1.0
          y: 0.0
      - position:  # right
          x: 1.0
          y: 0.0
        rotation_eul:
          yaw: 3.14
      - position:  # above
          x: 0.0
          y: 0.8
        rotation_eul:
          yaw: -1.57
      - position:  # below
          x: 0.0
          y: -0.8
        rotation_eul:
          yaw: 1.57
    wall_width: 0.2
    color: [0, 1, 0]

  - name: kitchen
    footprint:
      type: polygon
      coords:
        - [-4, -3]
        - [-0.5, -3]
        - [-0.5, -1.75]
        - [-2.25, -1.75]
        - [-2.25, -0.5]
        - [-4, -0.5]
    wall_width: 0.2
    color: [1, 0, 0]

  - name: trash
    footprint:
      type: polygon
      coords:
        - [-4, 0.5]
        - [-2.25, 0.5]
        - [-2.25, 1.75]
        - [-0.5, 1.75]
        - [-0.5, 3]
        - [-4, 3]
    wall_width: 0.2
    color: [0.1, 0.1, 0.1]

  - name: closet
    footprint:
      type: polygon
      coords:
        - [0.5, 1.75]
        - [2.25, 1.75]
        - [2.25, 0.5]
        - [4, 0.5]
        - [4, 3]
        - [0.5, 3]
    wall_width: 0.2
    color: [0.7, 0.4, 0.5]

  - name: office
    footprint:
      type: polygon
      coords:
        - [0.5, -3]
        - [4, -3]
        - [4, -0.5]
        - [2.25, -0.5]
        - [2.25, -1.75]
        - [0.5, -1.75]
    wall_width: 0.2
    color: [0.0, 0.0, 1.0]

hallways:
  - room_start: dining
    room_end: office
    width: 0.6
    conn_method: angle
    conn_angle: -1.57
    offset: 1.1
    is_open: true
    is_locked: false

  - room_start: dining
    room_end: closet
    width: 0.6
    conn_method: angle
    conn_angle: 1.57
    offset: -1.1
    is_open: true
    is_locked: false

  - room_start: dining
    room_end: trash
    width: 0.6
    conn_method: angle
    conn_angle: 1.57
    offset: 1.1
    is_open: true
    is_locked: false

  - room_start: dining
    room_end: kitchen
    width: 0.6
    conn_method: angle
    conn_angle: -1.57
    offset: -1.1
    is_open: true
    is_locked: false

  - room_start: kitchen
    room_end: trash
    width: 0.8
    conn_method: angle
    conn_angle: 1.57
    offset: 0.6
    is_open: true
    is_locked: false

  - room_start: kitchen
    room_end: office
    width: 0.8
    conn_method: angle
    conn_angle: 0.0
    offset: -0.5
    is_open: true
    is_locked: false

  - room_start: closet
    room_end: trash
    width: 0.8
    conn_method: angle
    conn_angle: 3.14
    offset: -0.5
    is_open: true
    is_locked: false

  - room_start: closet
    room_end: office
    width: 0.8
    conn_method: angle
    conn_angle: -1.57
    offset: 0.6
    is_open: true
    is_locked: false

locations:
  - name: table
    parent: dining
    category: table
    pose:
      position:
        x: 0.0
        y: 0.15

  - name: desk
    parent: office
    category: desk
    pose:
      position:
        x: 3.6
        y: -2.3

  - name: fridge
    parent: kitchen
    category: storage
    pose:
      position:
        x: -3.0
        y: -2.65
    is_open: false

  - name: pantry
    parent: kitchen
    category: storage
    pose:
      position:
        x: -3.65
        y: -1.5
      rotation_eul:
        yaw: 1.57
    is_open: false

  - name: bin
    parent: office
    category: trashcan_small
    pose:
      position:
        x: 2.6
        y: -0.85

  - name: dumpster
    parent: trash
    category: trashcan_large
    pose:
      position:
        x: -3.4
        y: 2.4

  - name: charger
    parent: closet
    category: charger
    pose:
      position:
        x: 3.5
        y: 2.5
      rotation_eul:
        yaw: -0.785
    is_charger: true

objects:
  - name: bread0
    category: bread
    parent: {choices: [pantry, fridge, desk]}

  - name: butter0
    category: butter
    parent: {choices: [pantry, fridge, desk]}

  - name: soda0
    category: soda
    parent: {choices: [pantry, fridge, desk]}

  - name: snacks0
    category: snacks
    parent: {choices: [pantry, fridge, desk]}

  - name: waste0
    category: waste
    parent: {choices: [desk, table]}

  - name: waste1
    category: waste
    parent: bin
