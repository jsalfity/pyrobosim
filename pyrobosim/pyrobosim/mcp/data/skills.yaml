skills:
  - name: navigate
    description: Plan and follow a path to a target location or pose. Use location names from the world vocabulary (e.g., pantry, fridge, table). The robot will automatically navigate to the appropriate position for interacting with objects at that location.
    params:
      target_location:
        type: string
        source: [literal, blackboard]
        required: false
      pose:
        type: pose
        source: [literal, blackboard]
        required: false
      path:
        type: path
        source: [literal, blackboard]
        required: false
    outputs: [status, message, last_nav_result, battery_level, robot_location, held_object, held_category, objects_here, open_locations]

  - name: pick
    description: Pick up an object at the current location. The robot must be at a location where the object is present. Use object names or categories from the world vocabulary. CONSTRAINT - Single-arm robot can only hold one object at a time; cannot pick while already holding something.
    params:
      object:
        type: string
        source: [literal, blackboard]
        required: false
      pose:
        type: pose
        source: [literal, blackboard]
        required: false
    outputs: [status, message, battery_level, robot_location, held_object, held_category, objects_here, open_locations]

  - name: place
    description: Place the currently held object at the current location. The robot must be at a location where objects can be placed (navigate to a location first).
    params:
      pose:
        type: pose
        source: [literal, blackboard]
        required: false
    outputs: [status, message, battery_level, robot_location, held_object, held_category, objects_here, open_locations]

  - name: detect
    description: Detect objects at the current location. The robot must be at a location (navigate there first). If the location can be closed (e.g., pantry, fridge), it must be opened first using the open action. The object parameter can be a specific object name or category from the world vocabulary.
    params:
      object:
        type: string
        source: [literal, blackboard]
        required: false
    outputs: [status, message, detected_objects, detected_categories, battery_level, robot_location, held_object, held_category, objects_here, open_locations]

  - name: open
    description: Open the current location or target location if provided. Certain locations like pantry and fridge must be opened before you can detect or pick objects inside them. CONSTRAINT - Cannot open while holding an object (single-arm robot).
    params:
      target_location:
        type: string
        source: [literal, blackboard]
        required: false
    outputs: [status, message, battery_level, robot_location, held_object, held_category, objects_here, open_locations]

  - name: close
    description: Close the current location or target location if provided. CRITICAL CONSTRAINT - Cannot close while holding an object (single-arm robot). Only close locations when NOT holding anything. If you pick an object from a location, do NOT close it until after you place the object elsewhere.
    params:
      target_location:
        type: string
        source: [literal, blackboard]
        required: false
    outputs: [status, message, battery_level, robot_location, held_object, held_category, objects_here, open_locations]
