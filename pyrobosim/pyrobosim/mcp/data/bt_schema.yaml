schema_version: "1.0"
description: "PyRoboSim behavior tree JSON format."
notes:
  - "Top-level BT JSON must include a `root` object."
  - "Memory rule: set memory=true on any sequence/selector that contains action nodes, so completed actions are not re-run on subsequent ticks."
  - "Use memory=false only for purely reactive condition/sensor chains that should re-evaluate from the start every tick."
node_types: [sequence, selector, parallel, decorator, condition, action]

action_node:
  type: action
  fields:
    name: string
    action: string
    params:
      param_format:
        literal: any
        blackboard:
          source: blackboard
          key: string
          default: any
        pose:
          pose:
            x: float
            y: float
            yaw: float
        path:
          path:
            - x: float
              y: float
              yaw: float
    outputs:
      status: blackboard_key
      message: blackboard_key
      result: blackboard_key
      detected_objects: blackboard_key
      detected_categories: blackboard_key
      battery_level: blackboard_key
      last_nav_result: blackboard_key
      # World-state outputs. The keys above report what the action just did;
      # these report the state of the world after it ran.
      #   robot_location: name of the robot's current location, or null when
      #     it is between locations.
      #   held_object: name of the grasped object, or the string "__none__"
      #     when the gripper is empty. A never-written key also reads as null,
      #     so the sentinel is what makes "holding nothing" testable.
      robot_location: blackboard_key
      held_object: blackboard_key
      held_category: blackboard_key
      objects_here: blackboard_key

condition_node:
  type: condition
  fields:
    name: string
    key: blackboard_key
    operator: ["==", "!=", ">", ">=", "<", "<=", in, contains, truthy]
    value: any

composite_nodes:
  sequence:
    children: list
    memory: bool
  selector:
    children: list
    memory: bool
  parallel:
    children: list
    policy: [success_on_all, success_on_one]

decorator_node:
  type: decorator
  fields:
    decorator: [inverter, retry]
    num_failures: int
    child: node

blackboard:
  initial: dict
