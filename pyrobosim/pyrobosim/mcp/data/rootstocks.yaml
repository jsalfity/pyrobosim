rootstocks:
  - name: detect_pick
    description: Canonical detect-gated manipulation pattern for direct pick tasks.
    when_to_use: Use when the task is to go to one location, verify the target object, and pick it.
    fill: >-
      Replace each $slot with its value, keep or remove the optional nodes as
      noted, and place the template inside <BehaviorTree ID="Main">. Rename
      nodes if a template is used more than once in a tree.
    slots:
      object_query: Object name or category to detect and pick.
      source_location: Location or object spawn to navigate to before detect and pick.
    optional_nodes:
      open_source: Keep only when $source_location must be opened first, such as pantry or fridge.
    anti_pattern: >-
      Do not pick before detect succeeds. Do not close a container while
      holding an object: this robot is single-arm, so open and close both
      require an empty gripper and fail at runtime otherwise, aborting the
      task. Close only if the task asks for the container to end closed, and
      then only after the object has been placed.
    template: |
      <Sequence name="detect_pick" memory="true">
        <navigate name="navigate_to_source" target_location="$source_location"/>
        <open name="open_source"/>
        <detect name="detect_target" object="$object_query"/>
        <pick name="pick_target" object="$object_query"/>
      </Sequence>

  - name: search_pick_selector
    description: Two-branch selector search pattern with a guarded detect-and-pick branch at each location.
    when_to_use: Use when the task says to search one location, then fall back to a second location, and pick the object if found.
    fill: >-
      Replace each $slot with its value, keep or remove the optional nodes as
      noted, and place the template inside <BehaviorTree ID="Main">. Rename
      nodes if a template is used more than once in a tree.
    slots:
      object_query: Object name or category to detect and pick.
      primary_location: First search location.
      fallback_location: Second search location.
    optional_nodes:
      open_primary: Keep only when $primary_location must be opened first, such as pantry or fridge.
      open_fallback: Keep only when $fallback_location must be opened first, such as pantry or fridge.
    anti_pattern: >-
      Do not make the fallback branch a blind navigate-and-pick sequence. Do
      not close a container while holding an object: close requires an empty
      gripper on this single-arm robot and fails at runtime. Close only if the
      task asks for it, and then only after the object has been placed.
    template: |
      <Selector name="search" memory="true">
        <Sequence name="search_primary" memory="true">
          <navigate name="navigate_primary" target_location="$primary_location"/>
          <open name="open_primary"/>
          <detect name="detect_primary" object="$object_query"/>
          <pick name="pick_primary" object="$object_query"/>
        </Sequence>
        <Sequence name="search_fallback" memory="true">
          <navigate name="navigate_fallback" target_location="$fallback_location"/>
          <open name="open_fallback"/>
          <detect name="detect_fallback" object="$object_query"/>
          <pick name="pick_fallback" object="$object_query"/>
        </Sequence>
      </Selector>

  - name: search_pick_deliver
    description: Search with selector fallback, then deliver by place or return. If the object is dropped or a step fails, it finds the object again and carries on.
    when_to_use: Use when the task says to search across candidate locations and then either place the object somewhere or return to a destination while holding it.
    fill: >-
      Replace each $slot with its value, keep or remove the optional nodes as
      noted, and place the template inside <BehaviorTree ID="Main">. Rename
      nodes if a template is used more than once in a tree.
    slots:
      object_query: Object category to detect, pick and check for in the gripper.
      primary_location: First search location.
      fallback_location: Second search location.
      destination_location: Delivery destination.
    optional_nodes:
      open_primary: Keep only when $primary_location must be opened first, such as pantry or fridge.
      open_fallback: Keep only when $fallback_location must be opened first, such as pantry or fridge.
      place_at_destination: Keep when the task is to place the object at $destination_location; remove it when the task is to return there holding it.
      still_holding_target: Keep when the task is to return to $destination_location holding the object; remove it when the task is to place it.
    anti_pattern: >-
      Do not put delivery actions inside only one selector branch. Do not open
      or close any container while holding an object: both require an empty
      gripper on this single-arm robot and fail at runtime. If the destination
      is a container that must be opened, open it before picking the object.
      Close only if the task asks for it, and then only after placing. Do not
      remove the holding_target check: it is what notices a dropped object.
    template: |
      <Retry name="try_again" num_failures="5">
        <Sequence name="deliver_when_held" memory="false">
          <Selector name="have_target" memory="false">
            <Check name="holding_target" key="held_category" operator="==" value="$object_query"/>
            <Selector name="search" memory="true">
              <Sequence name="search_primary" memory="true">
                <navigate name="navigate_primary" target_location="$primary_location"/>
                <open name="open_primary"/>
                <detect name="detect_primary" object="$object_query"/>
                <pick name="pick_primary" object="$object_query"/>
              </Sequence>
              <Sequence name="search_fallback" memory="true">
                <navigate name="navigate_fallback" target_location="$fallback_location"/>
                <open name="open_fallback"/>
                <detect name="detect_fallback" object="$object_query"/>
                <pick name="pick_fallback" object="$object_query"/>
              </Sequence>
            </Selector>
          </Selector>
          <Sequence name="deliver" memory="true">
            <navigate name="navigate_destination" target_location="$destination_location"/>
            <place name="place_at_destination"/>
            <Check name="still_holding_target" key="held_category" operator="==" value="$object_query"/>
          </Sequence>
        </Sequence>
      </Retry>

  - name: retrieve_and_restore
    description: Retrieve an object from a closeable container, deliver it, then restore the container to closed.
    when_to_use: >-
      Use when the task asks for the container to end closed -- "close the
      fridge", "leave it as you found it", "put it back the way it was". If the
      task does not ask for that, use detect_pick or search_pick_deliver and
      leave the container open.
    fill: >-
      Replace each $slot with its value and place the template inside
      <BehaviorTree ID="Main">. Rename nodes if a template is used more than
      once in a tree.
    slots:
      object_query: Object category to detect, pick and check for in the gripper.
      source_location: Container holding the object, which must end closed.
      destination_location: Where the object must end up.
    anti_pattern: >-
      Do not close the container immediately after picking. This robot is
      single-arm: close requires an empty gripper, so closing while still
      holding the object fails at runtime and aborts the task. The gripper is
      free only after place, which is why the close comes last and needs a
      navigate back to the container.
    template: |
      <Sequence name="retrieve_and_restore" memory="true">
        <Retry name="try_again" num_failures="5">
          <Sequence name="deliver_when_held" memory="false">
            <Selector name="have_target" memory="false">
              <Check name="holding_target" key="held_category" operator="==" value="$object_query"/>
              <Sequence name="retrieve" memory="true">
                <navigate name="navigate_to_source" target_location="$source_location"/>
                <open name="open_source" target_location="$source_location"/>
                <detect name="detect_target" object="$object_query"/>
                <pick name="pick_target" object="$object_query"/>
              </Sequence>
            </Selector>
            <Sequence name="deliver" memory="true">
              <navigate name="navigate_to_destination" target_location="$destination_location"/>
              <place name="place_target"/>
            </Sequence>
          </Sequence>
        </Retry>
        <navigate name="navigate_back_to_source" target_location="$source_location"/>
        <close name="close_source" target_location="$source_location"/>
      </Sequence>
